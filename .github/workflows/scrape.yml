name: 一番くじ スクレイピング＋相場取得

on:
  schedule:
    - cron: '0 1 * * *'   # 毎日 10:00 JST（UTC 01:00）
    - cron: '0 2 * * 0'   # 毎週日曜 11:00 JST（UTC 02:00）に画像チェック追加実行
  workflow_dispatch:       # 手動実行も可能

jobs:
  scrape-and-generate:
    runs-on: ubuntu-latest
    # 新作速報（news-posts/*.md）の自動生成とコミットは廃止した（2026-11、/news は /kuji へ転送）。
    # リポジトリへ書き込まないので読み取り権限だけにする。
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install requests beautifulsoup4

      - name: ① スクレイピング実行（Supabaseに登録）
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/scrape_and_register.py

      - name: ② 画像URL死活チェック＆自動修復（日曜のみ）
        if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/check_and_fix_images.py

      - name: ③ 景品の参考価格を取得（Yahoo Shopping＋ヤフオク落札相場）
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: python scripts/fetch_prize_prices.py

      # 予定は10:00 JSTだが、GitHubの混雑で実際には毎日14〜16時台に動く。サイトの定時の更新（12時台）より後になり、
      # 新作が翌日まで載らなかったため、取り込みが終わったらすぐ、増えたくじのページと一覧・サイトマップだけを更新する
      # （app/api/cron/revalidate-changed/route.ts の scope=scrape）。相場取得が失敗しても①の分は反映したいので常に実行する。
      # CRON_SECRET は Vercel の環境変数と同じ値を、このリポジトリの Secrets に登録する。
      - name: ④ 新しく登録したくじのページを更新
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://kujinone.com/api/cron/revalidate-changed?scope=scrape"
