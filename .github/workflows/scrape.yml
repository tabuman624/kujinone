name: 一番くじ スクレイピング＋相場取得

on:
  schedule:
    - cron: '0 1 * * *'   # 毎日 10:00 JST（UTC 01:00）
    - cron: '0 2 * * 0'   # 毎週日曜 11:00 JST（UTC 02:00）に画像チェック追加実行
  workflow_dispatch:       # 手動実行も可能

jobs:
  scrape-and-generate:
    runs-on: ubuntu-latest
    # 新作速報（news-posts/*.md）の自動生成とコミットは廃止した（2026-11、/news は /kuji へ転送）。
    # リポジトリへ書き込まないので読み取り権限だけにする。
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install requests beautifulsoup4

      - name: ① スクレイピング実行（Supabaseに登録）
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/scrape_and_register.py

      - name: ② 画像URL死活チェック＆自動修復（日曜のみ）
        if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/check_and_fix_images.py

      - name: ③ 景品の参考価格を取得（Yahoo Shopping＋ヤフオク落札相場）
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: python scripts/fetch_prize_prices.py
